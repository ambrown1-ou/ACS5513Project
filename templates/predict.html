{% extends "base.html" %}
{% block content %}
<a class="back" href="{{ url_for('web.index') }}">&larr; Return to Introduction</a>
<section class="page-heading">
  <p class="eyebrow">Model Deployment</p>
  <h1>Prediction Test</h1>
  <p class="lede">Enter patient measurements and review the trained model's output for a single case.</p>
</section>
<form class="form-panel" method="post">
  <div class="form-grid form-grid--single">
    <label>Deployment Model
      <select name="model_id" required>
        <option value="">Select a model to deploy</option>
        {% for model in models %}
        <option value="{{ model.model_id }}">{{ model.display_name }}</option>
        {% endfor %}
      </select>
      <span class="hint">Choose which trained model to use for this test.</span>
    </label>
  </div>
  <div class="form-grid">
  {% for field, info in fields.items() %}
    <label>{{ info.label }}
      {% if info.options %}
      <select name="{{ field }}" required>
        <option value="">Choose a value</option>
        {% for option in info.options %}
        <option value="{{ option.value }}">{{ option.label }}</option>
        {% endfor %}
      </select>
      {% else %}
      <input type="number" name="{{ field }}" step="any" required>
      {% endif %}
      <span class="hint">{{ info.desc }}{% if info.domain %} Domain: {{ info.domain }}{% endif %}</span>
    </label>
  {% endfor %}
  </div>
  <button type="submit">Run model <span aria-hidden="true">&#8594;</span></button>
</form>
{% endblock %}
