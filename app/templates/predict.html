{% extends "base.html" %}
{% block content %}
<a class="back" href="{{ url_for('web.index') }}">&larr; Return to Introduction</a>
<section class="page-heading">
  <p class="eyebrow">Model Deployment</p>
  <h1>Prediction Test</h1>
  <p class="lede">Enter patient measurements and review the trained model's output for a single case.</p>
</section>
<form class="form-panel" method="post" data-api-form="prediction">
  <div class="form-grid form-grid--single">
    <label>Deployment Model
      <select name="model_id" data-prediction-model required>
        <option value="" disabled selected>Loading models...</option>
      </select>
      <span class="hint">Choose which trained model to use for this test.</span>
    </label>
  </div>
  <div class="form-grid" data-prediction-fields aria-live="polite">
    <p class="field-help">Loading model input fields...</p>
  </div>
  <button type="submit">Run model <span aria-hidden="true">&#8594;</span></button>
  <p class="api-status" data-api-status hidden role="status"></p>
  <div class="api-result" data-prediction-result hidden role="status"></div>
</form>
<script src="{{ url_for('static', filename='form_builder.js') }}" defer></script>
{% endblock %}
